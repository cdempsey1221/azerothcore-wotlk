version: '3.8'  # Match the version used in your main docker-compose.yml

services:
  ac-worldserver:
    volumes:
      # Mount modules from host
      - /mnt/sdb2/wow_config/modules:/azerothcore/modules

  phpmyadmin:
    image: phpmyadmin
    networks:
      - ac-network
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
    restart: unless-stopped
    profiles: []
